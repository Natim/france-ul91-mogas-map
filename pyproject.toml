[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuelmap"
version = "1.0.0"
description = "Aérodromes français distribuant de l'essence sans plomb (UL91 / mogas), extraits de l'eAIP du SIA"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Rémy Hubscher" }]
keywords = ["aviation", "general-aviation", "ul91", "mogas", "avgas", "france", "aerodrome"]
dependencies = []

[project.urls]
Homepage = "https://natim.github.io/france-ul91-mogas-map/"
Source = "https://github.com/Natim/france-ul91-mogas-map"

[project.scripts]
fuelmap = "fuelmap.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
