<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carte des aérodromes UL91 / Mogas en France</title>
<meta name="description" content="Carte des aérodromes français distribuant de l'AVGAS UL91 ou de l'essence SP95/SP98 (Super Plus, UL AERO SUPER+), avec les conditions d'accès, extraite de l'eAIP officiel du SIA." />
<link rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin="" />
<style>
  :root {
    --self-service: #2ecc71;
    --restricted: #f39c12;
    --unknown: #9aa0a6;
    --ink: #202124;
    --muted: #5f6368;
  }
  html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; color: var(--ink); }
  #map { position: absolute; inset: 0; }

  .panel {
    position: absolute; top: 12px; right: 12px; z-index: 1000;
    background: rgba(255, 255, 255, 0.97); padding: 14px 16px;
    border-radius: 10px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.22);
    font-size: 13px; width: 290px; max-height: calc(100% - 24px);
    overflow-y: auto;
  }
  .panel h1 { margin: 0 0 6px; font-size: 15px; }
  .panel h2 {
    margin: 14px 0 6px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted);
  }
  .meta { color: var(--muted); font-size: 11px; line-height: 1.5; }
  a { color: #2c7bb6; }

  .search {
    width: 100%; box-sizing: border-box; margin-top: 10px; padding: 7px 9px;
    border: 1px solid #ccc; border-radius: 6px; font-size: 13px;
  }

  .filters label {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none; line-height: 1.9;
  }
  .filters .count { color: var(--muted); font-size: 11px; margin-left: auto; }
  .filters input { flex: none; }

  /* Shape encodes the fuel family, fill encodes how obtainable it is. */
  .key {
    display: inline-block; width: 15px; height: 15px; flex: none;
    border: 2px solid white; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
    background: var(--muted);
  }
  .key-ul91 { border-radius: 50%; }
  .key-mogas { border-radius: 3px; }
  .key-self_service { background: var(--self-service); }
  .key-restricted { background: var(--restricted); }
  .key-unknown { background: var(--unknown); }

  .marker {
    width: 15px; height: 15px; box-sizing: border-box;
    border: 2px solid white; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
  }
  .marker-ul91 { border-radius: 50%; }
  .marker-mogas { border-radius: 3px; }
  .marker-self_service { background: var(--self-service); }
  .marker-restricted { background: var(--restricted); }
  .marker-unknown { background: var(--unknown); }

  .note { margin-top: 12px; font-size: 11px; color: var(--muted); line-height: 1.45; }
  .status { margin-top: 10px; font-size: 12px; color: #c0392b; }
  .status:empty { display: none; }

  .popup-icao { font-weight: 700; font-size: 14px; }
  .popup-name { margin: 2px 0 8px; }
  .popup-row { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
  .popup-all { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .popup-note {
    margin-top: 7px; padding: 5px 7px; font-size: 11px; line-height: 1.45;
    background: #fdf5e3; border-left: 3px solid var(--restricted); color: #7a5c1e;
  }
  .popup-source { margin-top: 6px; font-size: 10px; color: var(--muted); }
  .badge {
    display: inline-block; vertical-align: 2px; margin-left: 4px;
    padding: 1px 5px; border-radius: 8px; font-size: 10px; font-weight: 600;
    background: #fdf5e3; color: #7a5c1e; border: 1px solid #e8d9b0;
  }
  .popup-section {
    margin-top: 8px; padding-top: 8px; border-top: 1px solid #e4e4e4;
    font-size: 11px; color: var(--muted); line-height: 1.45;
    max-height: 108px; overflow-y: auto;
  }
  .leaflet-popup-content { margin: 12px 14px; min-width: 230px; }

  @media (max-width: 640px) {
    .panel { left: 12px; right: 12px; width: auto; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <h1>Essence sans plomb en France</h1>
  <div class="meta" id="meta">Chargement…</div>

  <input type="search" class="search" id="search"
         placeholder="Filtrer par code OACI ou nom…" autocomplete="off" />

  <h2>Carburant</h2>
  <div class="filters" id="family-filters"></div>

  <h2>Conditions d'accès</h2>
  <div class="filters" id="availability-filters"></div>

  <div class="note" id="note"></div>
  <div class="status" id="status"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
<script>
const DATA_URL = "aerodromes.json";
const SUPPORTED_SCHEMA = 4;
const SOURCE_URL = "https://www.sia.aviation-civile.gouv.fr/";
const REPO_URL = "https://github.com/Natim/france-ul91-mogas-map";

// Keys must match fuelmap.model: FUEL_FAMILIES and AVAILABILITY_ORDER.
const FAMILIES = [
  { key: "ul91", label: "UL91 (AVGAS sans plomb)" },
  { key: "mogas", label: "SP95 / SP98 (dont UL AERO SUPER+)" },
];

const AVAILABILITY = [
  { key: "self_service", label: "Automate / H24" },
  { key: "restricted", label: "HX, PPR, sur demande" },
  { key: "unknown", label: "Non précisé" },
];

const FRANCE_CENTER = [46.7, 2.3];
const FRANCE_ZOOM = 6;
const MARKER_SIZE = 15;

// A field selling both families gets one marker per family. They share a
// position, so nudge them apart far enough to both be clickable.
const SPLIT_OFFSET_PX = 9;

const map = L.map("map").setView(FRANCE_CENTER, FRANCE_ZOOM);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution:
    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);

const entries = [];

function popupHtml(marker) {
  const name = marker.name || marker.icao;
  const section = marker.section
    ? `<div class="popup-section">${escapeHtml(marker.section)}</div>`
    : "";
  // The chart text below says nothing about access for these, so flag the
  // discrepancy rather than letting the reader find it.
  const note = marker.note
    ? `<div class="popup-note">${marker.source ? "Hors AIP" : "Hors VAC"} : ` +
      `${escapeHtml(marker.note)}</div>`
    : "";
  const source = marker.source
    ? `<div class="popup-source">Source : ${escapeHtml(marker.source)}</div>`
    : "";
  return (
    `<div class="popup-icao">${marker.icao}` +
    (marker.source ? ` <span class="badge">hors AIP</span>` : "") +
    `</div>` +
    `<div class="popup-name">${escapeHtml(name)}</div>` +
    `<div class="popup-row">` +
      `<span class="key key-${marker.family} key-${marker.availability}"></span>` +
      `<span><strong>${escapeHtml(marker.fuelsLabel)}</strong> — ` +
      `${escapeHtml(marker.availabilityLabel)}</span>` +
    `</div>` +
    note +
    `<div class="popup-all">Carburants recensés : ${escapeHtml(marker.allFuelsLabel)}</div>` +
    section +
    source
  );
}

function escapeHtml(value) {
  const div = document.createElement("div");
  div.textContent = value;
  return div.innerHTML;
}

function createMarker(data, offsetX) {
  const icon = L.divIcon({
    className: "",
    html: `<div class="marker marker-${data.family} marker-${data.availability}"></div>`,
    iconSize: [MARKER_SIZE, MARKER_SIZE],
    iconAnchor: [MARKER_SIZE / 2 - offsetX, MARKER_SIZE / 2],
  });
  const marker = L.marker([data.lat, data.lon], { icon });
  marker.bindPopup(popupHtml(data));
  marker.bindTooltip(
    `${data.icao} — ${data.name || ""} · ${data.fuelsLabel}` +
      (data.source ? " · hors AIP" : ""),
    { direction: "top" }
  );
  return marker;
}

function renderFilters(container, options, counts, group) {
  container.innerHTML = "";
  for (const option of options) {
    const label = document.createElement("label");
    const swatch =
      group === "family"
        ? `<span class="key key-${option.key} key-unknown"></span>`
        : `<span class="key key-ul91 key-${option.key}"></span>`;
    label.innerHTML =
      `<input type="checkbox" data-group="${group}" data-key="${option.key}" checked>` +
      swatch + option.label +
      `<span class="count">${counts[option.key] || 0}</span>`;
    container.appendChild(label);
  }
  container.addEventListener("change", applyFilters);
}

function checkedKeys(group) {
  return new Set(
    Array.from(
      document.querySelectorAll(`input[data-group="${group}"]:checked`)
    ).map((input) => input.dataset.key)
  );
}

// One pass over every marker, so the two filter groups and the search box
// cannot fight over which markers belong on the map.
function applyFilters() {
  const families = checkedKeys("family");
  const availability = checkedKeys("availability");
  const query = document.getElementById("search").value.trim().toLowerCase();
  let shown = 0;

  for (const { marker, data, haystack } of entries) {
    const visible =
      families.has(data.family) &&
      availability.has(data.availability) &&
      (!query || haystack.includes(query));
    if (visible) {
      shown += 1;
      if (!map.hasLayer(marker)) marker.addTo(map);
    } else if (map.hasLayer(marker)) {
      map.removeLayer(marker);
    }
  }

  document.getElementById("note").textContent =
    `${shown} marqueur${shown > 1 ? "s" : ""} affiché${shown > 1 ? "s" : ""}. ` +
    "Conditions déduites de la carte VAC, qui fait foi, sauf mention « hors VAC ».";
}

function fail(message) {
  document.getElementById("meta").textContent = "";
  document.getElementById("status").textContent = message;
}

async function load() {
  let data;
  try {
    const response = await fetch(DATA_URL, { cache: "no-cache" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    data = await response.json();
  } catch (error) {
    fail(
      `Impossible de charger les données (${error.message}). ` +
      "En local, servir le dossier via un serveur HTTP."
    );
    return;
  }

  if (data.schema !== SUPPORTED_SCHEMA) {
    fail(`Format de données inattendu (schéma ${data.schema}).`);
    return;
  }

  const perAerodrome = {};
  for (const marker of data.markers) {
    (perAerodrome[marker.icao] ||= []).push(marker);
  }

  const familyCounts = {};
  const availabilityCounts = {};

  for (const marker of data.markers) {
    familyCounts[marker.family] = (familyCounts[marker.family] || 0) + 1;
    availabilityCounts[marker.availability] =
      (availabilityCounts[marker.availability] || 0) + 1;

    const siblings = perAerodrome[marker.icao];
    const index = siblings.indexOf(marker);
    const offsetX =
      siblings.length > 1
        ? (index - (siblings.length - 1) / 2) * SPLIT_OFFSET_PX * 2
        : 0;

    entries.push({
      marker: createMarker(marker, offsetX),
      data: marker,
      haystack: `${marker.icao} ${marker.name}`.toLowerCase(),
    });
  }

  document.getElementById("meta").innerHTML =
    `${data.aerodromeCount} terrains · AIRAC ${data.airac} · MAJ ${data.generated}<br>` +
    `Source : <a href="${SOURCE_URL}" target="_blank" rel="noopener">eAIP SIA</a> · ` +
    `<a href="${REPO_URL}" target="_blank" rel="noopener">Code et données</a>`;

  renderFilters(
    document.getElementById("family-filters"), FAMILIES, familyCounts, "family"
  );
  renderFilters(
    document.getElementById("availability-filters"),
    AVAILABILITY, availabilityCounts, "availability"
  );
  document.getElementById("search").addEventListener("input", applyFilters);
  applyFilters();
}

load();
</script>
</body>
</html>
