<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carte des aérodromes UL91 / Mogas en France</title>
<meta name="description" content="Carte des aérodromes français distribuant de l'essence aviation sans plomb (UL91, UL AERO SUPER+) ou du mogas (Super Plus, SP95, SP98), extraite de l'eAIP officiel du SIA." />
<link rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin="" />
<style>
  :root {
    --color-ul91: #2ecc71;
    --color-mogas: #f39c12;
    --color-both: #3498db;
  }
  html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }

  .panel {
    position: absolute; top: 12px; right: 12px; z-index: 1000;
    background: rgba(255, 255, 255, 0.96); padding: 12px 16px;
    border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    font-size: 13px; max-width: 300px;
  }
  .panel h1 { margin: 0 0 6px; font-size: 15px; }
  .panel .meta { color: #666; font-size: 11px; line-height: 1.5; }
  .panel a { color: #2c7bb6; }

  .search { width: 100%; box-sizing: border-box; margin-top: 10px; padding: 6px 8px;
    border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }

  .legend { margin-top: 10px; }
  .legend label {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none; line-height: 1.7;
  }
  .legend .count { color: #888; font-size: 11px; margin-left: auto; }
  .dot {
    display: inline-block; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid white; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.3); flex: none;
  }
  .dot-ul91 { background: var(--color-ul91); }
  .dot-mogas { background: var(--color-mogas); }
  .dot-both { background: var(--color-both); }

  .status { margin-top: 10px; font-size: 12px; color: #c0392b; }
  .status:empty { display: none; }

  .popup-icao { font-weight: bold; font-size: 14px; }
  .popup-name { margin: 4px 0; }
  .popup-fuels { font-size: 12px; color: #444; }

  @media (max-width: 600px) {
    .panel { left: 12px; right: 12px; max-width: none; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <h1>Essence sans plomb en France</h1>
  <div class="meta" id="meta">Chargement…</div>

  <input type="search" class="search" id="search"
         placeholder="Filtrer par code OACI ou nom…" autocomplete="off" />

  <div class="legend" id="legend"></div>
  <div class="status" id="status"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
<script>
const DATA_URL = "aerodromes.json";
const SUPPORTED_SCHEMA = 1;
const SOURCE_URL = "https://www.sia.aviation-civile.gouv.fr/";
const REPO_URL = "https://github.com/Natim/france-ul91-mogas-map";

// Order defines the legend order. Keys match `category` in the JSON, which is
// produced by fuelmap.model.map_category.
const CATEGORIES = [
  { key: "ul91", label: "UL91 / UL AERO SUPER+", color: "#2ecc71" },
  { key: "mogas", label: "Mogas (Super Plus / SP95-98)", color: "#f39c12" },
  { key: "both", label: "UL91 + Mogas", color: "#3498db" },
];

const FRANCE_CENTER = [46.7, 2.3];
const FRANCE_ZOOM = 6;

const map = L.map("map").setView(FRANCE_CENTER, FRANCE_ZOOM);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution:
    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);

const markers = [];

function createMarker(aerodrome, color) {
  const marker = L.circleMarker([aerodrome.lat, aerodrome.lon], {
    radius: 7,
    weight: 2,
    color: "white",
    fillColor: color,
    fillOpacity: 0.95,
  });
  const name = aerodrome.name || aerodrome.icao;
  marker.bindPopup(
    `<div class="popup-icao">${aerodrome.icao}</div>` +
    `<div class="popup-name">${name}</div>` +
    `<div class="popup-fuels">${aerodrome.fuelsLabel}</div>`
  );
  marker.bindTooltip(`${aerodrome.icao} — ${name}`, { direction: "top" });
  return marker;
}

function renderLegend(counts) {
  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  for (const category of CATEGORIES) {
    const label = document.createElement("label");
    label.innerHTML =
      `<input type="checkbox" data-category="${category.key}" checked>` +
      `<span class="dot dot-${category.key}"></span>${category.label}` +
      `<span class="count">${counts[category.key] || 0}</span>`;
    legend.appendChild(label);
  }
  legend.addEventListener("change", applyFilters);
}

// A single pass over every marker keeps the legend checkboxes and the search
// box from fighting over which markers are on the map.
function applyFilters() {
  const enabled = new Set(
    Array.from(document.querySelectorAll(".legend input:checked"))
      .map((input) => input.dataset.category)
  );
  const query = document.getElementById("search").value.trim().toLowerCase();

  for (const { marker, aerodrome, haystack } of markers) {
    const visible =
      enabled.has(aerodrome.category) && (!query || haystack.includes(query));
    if (visible && !map.hasLayer(marker)) {
      marker.addTo(map);
    } else if (!visible && map.hasLayer(marker)) {
      map.removeLayer(marker);
    }
  }
}

function fail(message) {
  document.getElementById("meta").textContent = "";
  document.getElementById("status").textContent = message;
}

async function load() {
  let data;
  try {
    const response = await fetch(DATA_URL, { cache: "no-cache" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    data = await response.json();
  } catch (error) {
    fail(
      `Impossible de charger les données (${error.message}). ` +
      "En local, servir le dossier via un serveur HTTP."
    );
    return;
  }

  if (data.schema !== SUPPORTED_SCHEMA) {
    fail(`Format de données inattendu (schéma ${data.schema}).`);
    return;
  }

  const colors = Object.fromEntries(CATEGORIES.map((c) => [c.key, c.color]));
  const counts = {};

  for (const aerodrome of data.aerodromes) {
    counts[aerodrome.category] = (counts[aerodrome.category] || 0) + 1;
    const marker = createMarker(aerodrome, colors[aerodrome.category] || "#888");
    markers.push({
      marker,
      aerodrome,
      haystack: `${aerodrome.icao} ${aerodrome.name}`.toLowerCase(),
    });
  }

  document.getElementById("meta").innerHTML =
    `${data.aerodromes.length} terrains · AIRAC ${data.airac} · MAJ ${data.generated}<br>` +
    `Source : <a href="${SOURCE_URL}" target="_blank" rel="noopener">eAIP SIA</a> · ` +
    `<a href="${REPO_URL}" target="_blank" rel="noopener">Code et données</a>`;

  renderLegend(counts);
  document.getElementById("search").addEventListener("input", applyFilters);
  applyFilters();
}

load();
</script>
</body>
</html>
